  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="94" cy="104" r="42" fill="#fff9ef" opacity=".28"/>
  <circle cx="424" cy="110" r="56" fill="#fff9ef" opacity=".18"/>

