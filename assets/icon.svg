<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Control Financiero</title>
  <desc id="desc">Alcancía rosada que representa ahorro, ingresos y control financiero, con una pequeña firma JD.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="470" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe2d3"/>
      <stop offset="1" stop-color="#f5a89c"/>
    </linearGradient>
    <linearGradient id="pig" x1="155" y1="160" x2="390" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc0ae"/>
      <stop offset="1" stop-color="#df756d"/>
    </linearGradient>
    <linearGradient id="hat" x1="160" y1="70" x2="350" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6654"/>
      <stop offset="1" stop-color="#c82f39"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="90" cy="105" r="42" fill="#fff6df" opacity=".25"/>
  <circle cx="430" cy="115" r="58" fill="#fff6df" opacity=".18"/>
  <circle cx="80" cy="390" r="70" fill="#f28b82" opacity=".13"/>

  <!-- Alcancía -->
  <g filter="url(#softShadow)">
    <path d="M166 198c-17-34-7-67 22-78 25-10 48 5 61 30 14-25 38-40 63-30 29 11 39 44 22 78 33 27 52 68 52 116 0 79-56 132-154 132S78 393 78 314c0-48 20-89 55-116l33 0Z" fill="url(#pig)" stroke="#9d4c53" stroke-width="8" stroke-linejoin="round"/>
    <path d="M143 215c-37-22-60-52-44-76 17-25 53-10 78 21" fill="#f59d92" stroke="#9d4c53" stroke-width="8"/>
    <path d="M345 215c37-22 60-52 44-76-17-25-53-10-78 21" fill="#f59d92" stroke="#9d4c53" stroke-width="8"/>
    <path d="M154 190c11-19 28-31 48-37M349 190c-11-19-28-31-48-37" fill="none" stroke="#ffd8ca" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="254" cy="266" rx="78" ry="57" fill="#ffad9c" stroke="#9d4c53" stroke-width="7"/>
    <ellipse cx="228" cy="263" rx="12" ry="17" fill="#8d4149"/>
    <ellipse cx="280" cy="263" rx="12" ry="17" fill="#8d4149"/>
    <path d="M198 221c18-20 39-26 57-26 20 0 43 7 59 26" fill="none" stroke="#fff1e8" stroke-width="10" stroke-linecap="round" opacity=".85"/>
    <path d="M208 320c16 20 32 28 49 28 18 0 36-9 50-28" fill="none" stroke="#9d4c53" stroke-width="8" stroke-linecap="round"/>
    <path d="M105 326c-12 18-8 42 10 51M401 326c12 18 8 42-10 51" fill="none" stroke="#9d4c53" stroke-width="9" stroke-linecap="round"/>
    <path d="M168 430v23M338 430v23" stroke="#9d4c53" stroke-width="14" stroke-linecap="round"/>
    <path d="M183 194h143" stroke="#8d4149" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Gorro festivo inspirado en la referencia -->
  <path d="M156 179c5-75 45-111 99-111 57 0 97 37 102 111-54 34-146 34-201 0Z" fill="url(#hat)" stroke="#8e2c37" stroke-width="8"/>
  <path d="M169 157c48 27 127 27 175 0" fill="none" stroke="#f5c34f" stroke-width="16"/>
  <path d="M187 110c18-18 39-25 67-25 29 0 51 7 70 25" fill="none" stroke="#ffd77a" stroke-width="7" stroke-dasharray="8 14" stroke-linecap="round"/>
  <circle cx="256" cy="59" r="18" fill="#f6c64b" stroke="#9e5a31" stroke-width="6"/>

  <!-- Monedas -->
  <g fill="#f4bf45" stroke="#9e5a31" stroke-width="6">
    <ellipse cx="133" cy="383" rx="35" ry="17" transform="rotate(-20 133 383)"/>
    <ellipse cx="177" cy="413" rx="38" ry="18" transform="rotate(8 177 413)"/>
    <ellipse cx="224" cy="430" rx="40" ry="19" transform="rotate(-5 224 430)"/>
    <ellipse cx="292" cy="428" rx="38" ry="18" transform="rotate(5 292 428)"/>
  </g>

  <!-- Firma pequeña del creador -->
  <rect x="390" y="414" width="70" height="42" rx="14" fill="#0f766e" stroke="#d9f4f0" stroke-opacity=".75" stroke-width="3"/>
  <text x="425" y="442" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="900" fill="#ecfeff" text-anchor="middle">JD</text>
</svg>
