<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="26" y="26" width="460" height="460" rx="108" fill="none" stroke="#a855f7" stroke-width="4" stroke-opacity="0.5"/>
  
  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="180" fill="#9333ea" opacity="0.15" filter="url(#glow)"/>

  <!-- Shield/Vault Icon outline -->
  <path d="M 256,90 L 375,145 C 375,270 256,360 256,380 C 256,360 137,270 137,145 Z" 
        fill="url(#accentGrad)" fill-opacity="0.25" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- JD Monogram in Center -->
  <text x="256" y="275" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="140" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="2"
        filter="url(#glow)">JD</text>

  <!-- Financial badge / Sparkle / Coins indicator -->
  <circle cx="345" cy="165" r="32" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
  <text x="345" y="177" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
  
  <!-- Bottom Finanzas label -->
  <text x="256" y="435" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" 
        font-weight="700" 
        fill="#d8b4fe" 
        text-anchor="middle" 
        letter-spacing="6">FINANZAS</text>
</svg>
