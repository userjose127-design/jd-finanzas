      <stop stop-color="#ffe6de"/>
      <stop offset="1" stop-color="#f4b1a8"/>
    </linearGradient>
    <linearGradient id="pig" x1="150" y1="190" x2="365" y2="425" gradientUnits="userSpaceOnUse">
