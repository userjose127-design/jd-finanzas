<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Control Financiero</title>
  <desc id="desc">Ícono centrado de una alcancía rosada con gorro rojo y una pequeña firma JD.</desc>
  <defs>
