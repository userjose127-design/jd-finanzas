  <path d="M145 215c-28-19-52-6-59 13-7 18 5 35 30 44-8 16-12 34-12 54 0 67 57 115 152 115s152-48 152-115c0-20-4-38-12-54 25-9 37-26 30-44-7-19-31-32-59-13-29-23-68-36-111-36s-82 13-111 36Z" fill="url(#pig)" stroke="#a65a60" stroke-width="8" stroke-linejoin="round"/>
  <path d="M161 204c22-22 52-34 95-34s73 12 95 34" fill="none" stroke="#fff0e9" stroke-width="12" stroke-linecap="round" opacity=".75"/>
  <path d="M165 205c-26-22-48-33-63-17-12 14-1 35 28 45M347 205c26-22 48-33 63-17 12 14 1 35-28 45" fill="none" stroke="#a65a60" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="256" cy="287" rx="65" ry="49" fill="#ffb5a8" stroke="#a65a60" stroke-width="7"/>
  <ellipse cx="234" cy="287" rx="9" ry="13" fill="#8f4850"/>
  <ellipse cx="278" cy="287" rx="9" ry="13" fill="#8f4850"/>
  <path d="M222 329c11 12 22 17 34 17s23-5 34-17" fill="none" stroke="#a65a60" stroke-width="7" stroke-linecap="round"/>
  <path d="M191 381c20 17 42 25 65 25s45-8 65-25" fill="none" stroke="#d77972" stroke-width="9" stroke-linecap="round"/>

